name: android-compose-state
category: platform
env: dev
inputs:
  prompt: |
    Compose로 목록 화면을 구현 중이다. 로딩·에러·콘텐츠 상태를 다루고
    화면 회전에도 상태가 유지되어야 한다. 상태 관리를 어떻게 설계해야 하나?
expected:
  must_contain: ["상태 호이스팅", "단방향 데이터 흐름", "ViewModel", "UiState"]
  must_not_contain: ["컴포저블 내부에서 직접 부수효과", "remember로 비즈니스 상태 보관", "GlobalScope"]
score_weights: { correctness: 0.7, cost: 0.15, latency: 0.15 }
baseline: { model: sonnet-4-6, score: 0.9 }
